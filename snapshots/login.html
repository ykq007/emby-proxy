<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>登录 · Emby Proxy</title>
    <script>(function(){var p='auto';try{p=localStorage.getItem('emby_theme')||'auto'}catch(e){}var l=p==='light'||(p!=='dark'&&matchMedia('(prefers-color-scheme: light)').matches);document.documentElement.dataset.theme=l?'light':'dark'})()</script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23e5a440'/%3E%3Cpath d='M6 15h3l2-6 2 8 2-4h3' fill='none' stroke='%23141619' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/console.2fefbe44fb.css">
</head>
<body class="login">
    <main class="login-box">
        <div class="brand"><i aria-hidden="true"></i>Emby Proxy</div>
        <h1>管理员登录</h1>
        <form id="loginForm" novalidate>
            <label class="field">
                <span>管理员密钥</span>
                <input type="password" id="tokenInput" autocomplete="current-password" aria-describedby="tokenError" autofocus>
            </label>
            <p class="field-err" id="tokenError" role="alert" hidden></p>
            <button type="submit" class="btn pri block">登录</button>
        </form>
        <div class="login-foot muted num">v2.5.1</div>
    </main>
    <script>
        var input = document.getElementById('tokenInput');
        var err = document.getElementById('tokenError');
        function showError(msg) {
            err.textContent = msg;
            err.hidden = false;
            input.setAttribute('aria-invalid', 'true');
            input.focus();
        }
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            var token = input.value.trim();
            if (!token) return showError('请输入管理员密钥');
            // A wrong key re-serves this page, so this marker surviving the reload is the only failure signal.
            try { sessionStorage.setItem('emby_login_attempted', '1'); } catch (x) {}
            // Secure only over https so local HTTP dev works. HttpOnly needs a Set-Cookie header, not JS.
            document.cookie = 'admin_token=' + encodeURIComponent(token)
                + '; path=/; max-age=2592000; SameSite=Strict'
                + (location.protocol === 'https:' ? '; Secure' : '');
            location.reload();
        });
        try {
            if (sessionStorage.getItem('emby_login_attempted')) {
                sessionStorage.removeItem('emby_login_attempted');
                showError('密钥不正确，请重试');
            }
        } catch (x) {}
        input.addEventListener('input', function () {
            input.removeAttribute('aria-invalid');
            err.hidden = true;
        });
    </script>
</body>
</html>
