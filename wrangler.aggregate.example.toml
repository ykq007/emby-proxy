# emby-aggregate：把多个 Emby 节点合并成一台虚拟 Emby 服务器的独立 Worker。
# 用法：复制为 wrangler.aggregate.prod.toml（已 gitignore），填入生产 D1 的 database_id，
# 然后 `npm run deploy:agg`。它与生产 Worker 共用同一个 D1，但只建 / 写 agg_ 表。
#
# 必须与生产 Worker 使用同一个 ADMIN_TOKEN（节点凭据用它派生的密钥加密）：
#   npx wrangler secret put ADMIN_TOKEN -c wrangler.aggregate.prod.toml
name = "emby-aggregate"
main = "aggregate.js"
compatibility_date = "2025-09-01"
workers_dev = true
# routes = [{ pattern = "agg.<你的域名>", custom_domain = true }]  # 自定义域名（区域须在同一账号）
keep_vars = true
no_bundle = true

[triggers]
# 目录同步：每次最多 AGG_SYNC_REQUESTS 个上游请求，每天最多 AGG_DAILY_WRITE_BUDGET 行 D1 写入。
crons = ["*/10 * * * *"]

[vars]
AGG_SERVER_NAME = "Emby Aggregate"
# AGG_NODES = "node1,node2"        # 留空 = 所有开启了 viewers 的节点
# AGG_EXCLUDE_NODES = "node3"       # 不参与聚合的节点（其副本在下一轮同步时移除）
# 同步 / 目录用哪个 viewer 的真实设备（设备 Id 原样出现在节点上，所以不借别人的设备）。留空 = 任何用过节点的设备。
# AGG_SYNC_VIEWER = "owner"
# AGG_DAILY_WRITE_BUDGET = "30000"  # Workers Paid 可调到 500000
# AGG_SYNC_REQUESTS = "20"         # Workers Paid 可调到 100

[[d1_databases]]
binding = "DB"
database_name = "emby-proxy-prod-db"
database_id = "<prod database_id from wrangler.prod.toml>"

# [limits]
# cpu_ms = 60000  # 仅 Workers Paid；免费版每次 10 ms

# Workers Logs：保留请求日志（含 console.log 与异常），在 Cloudflare 后台 Workers → emby-aggregate → Logs 查看。
[observability]
enabled = true
